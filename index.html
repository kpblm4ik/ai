<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header, footer { background: #2d2d2d; padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
        input { background: #3d3d3d; color: #fff; border: 1px solid #555; padding: 6px; border-radius: 4px; flex: 1; min-width: 120px; }
        button { background: #007acc; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 200px; background: #202020; border-right: 1px solid #444; display: flex; flex-direction: column; padding: 10px; gap: 5px; }
        #chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 8px; background: #2d2d2d; border-radius: 4px; cursor: pointer; margin-bottom: 4px; display: flex; justify-content: space-between; font-size: 13px; }
        .chat-item.active { background: #3a3a3a; border-left: 3px solid #007acc; }
        #box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #1a1a1a; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; }
        .user { align-self: flex-end; background: #0e639c; }
        .ai { align-self: flex-start; background: #333; }
        .sys { align-self: center; color: #aaa; font-size: 11px; }
        pre { background: #111; padding: 8px; border-radius: 4px; overflow-x: auto; color: #ff79c6; }
        @media (max-width: 600px) { #main { flex-direction: column; } #sidebar { width: auto; height: 120px; } }
    </style>
</head>
<body>
    <header>
        <input type="password" id="key" placeholder="Ключ API">
        <input type="text" id="url" placeholder="URL (https://proxyapi.ru)">
        <input type="text" id="mdl" placeholder="Модель">
        <button onclick="saveConf()">💾</button>
    </header>
    <div id="main">
        <div id="sidebar">
            <button onclick="newChat()" style="background:#28a745;">➕ Новый чат</button>
            <div id="chat-list"></div>
        </div>
        <div id="box"></div>
    </div>
    <footer>
        <input type="text" id="inp" placeholder="Запрос..." onkeydown="if(event.key==='Enter') send()">
        <button id="btn" onclick="send()">➡️</button>
    </footer>
    <script>
        let chats = {}, curId = null;
        window.onload = function() {
            document.getElementById('key').value = localStorage.getItem('pk') || '';
            document.getElementById('url').value = localStorage.getItem('pu') || '';
            document.getElementById('mdl').value = localStorage.getItem('pm') || 'anthropic/claude-sonnet-5-5';
            chats = JSON.parse(localStorage.getItem('pc') || '{}');
            const ids = Object.keys(chats);
            if (ids.length) { curId = ids[ids.length - 1]; loadList(); loadMsgs(); } else { newChat(); }
        };
        function saveConf() {
            let u = document.getElementById('url').value.trim();
            if (u && !u.endsWith('/chat/completions')) u += u.endsWith('/v1') ? '/chat/completions' : '/v1/chat/completions';
            localStorage.setItem('pk', document.getElementById('key').value.trim());
            localStorage.setItem('pu', u);
            localStorage.setItem('pm', document.getElementById('mdl').value.trim());
            document.getElementById('url').value = u;
            alert('OK');
        }
        function newChat() {
            curId = 'c_' + Date.now();
            chats[curId] = { title: 'Новый чат', messages: [] };
            save(); loadList(); loadMsgs();
        }
        function save() { localStorage.setItem('pc', JSON.stringify(chats)); }
        function loadList() {
            const l = document.getElementById('chat-list'); l.innerHTML = '';
            Object.keys(chats).forEach(id => {
                const i = document.createElement('div'); i.className = `chat-item ${id===curId?'active':''}`;
                i.onclick = () => { curId = id; loadList(); loadMsgs(); };
                i.innerHTML = `<span>${chats[id].title}</span><b onclick="event.stopPropagation(); delete chats['${id}']; save(); newChat();">❌</b>`;
                l.appendChild(i);
            });
        }
        function loadMsgs() {
            const b = document.getElementById('box'); b.innerHTML = '';
            if (!chats[curId] || !chats[curId].messages.length) { b.innerHTML = '<div class="sys">Чат пуст</div>'; return; }
            chats[curId].messages.forEach(m => {
                const d = document.createElement('div'); d.className = `msg ${m.role==='user'?'user':'ai'}`;
                let txt = m.content.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
                d.innerHTML = m.role==='assistant' ? txt.replace(/`([\s\S]*?)`/g, '<pre><code>$1</code></pre>').replace(/`([^`]+)`/g, '<code>$1</code>') : txt;
                b.appendChild(d);
            });
            b.scrollTop = b.scrollHeight;
        }
        async function send() {
    const i = document.getElementById('inp'), b = document.getElementById('btn'), t = i.value.trim();
    if (!t) return;
    const k = localStorage.getItem('pk'), u = localStorage.getItem('pu'), m = localStorage.getItem('pm');
    if (!k || !u) { alert('Настройте API!'); return; }
    i.value = ''; i.disabled = b.disabled = true;
    if (!chats[curId].messages.length) { chats[curId].title = t.substring(0,15); loadList(); }
    chats[curId].messages.push({role: 'user', content: t}); loadMsgs();
    try {
        const res = await fetch(u, {
            method: 'POST', 
            headers: { 'Authorization': `Bearer ${k}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                model: m, 
                messages: chats[curId].messages,
                max_tokens: 4096 // Решает проблему с обрывом кода! Клод допишет всё до конца
            })
        });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        
        // Безопасное извлечение ответа (работает и с choices[0], и без него)
        const aiMsg = data.choices && data.choices[0] ? data.choices[0].message.content : data.choices.message.content;
        
        chats[curId].messages.push({role: 'assistant', content: aiMsg});
        save(); loadMsgs();
    } catch (e) {
        document.getElementById('box').innerHTML += `<div class="sys">Ошибка: ${e.message}</div>`;
        chats[curId].messages.pop();
    } finally { i.disabled = b.disabled = false; i.focus(); }
        }
    </script>
</body>
</html>
