<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> AI Terminal</title>
    <style>
        :root {
            --bg-color: #0d0e11;
            --panel-color: #161920;
            --text-color: #e2e8f0;
            --accent-color: #00ff66; /* Неоновый зеленый */
            --user-msg: #1f2430;
            --ai-msg: #1a1f2c;
            --border-color: #2d3139;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Верхняя панель конфигурации */
        .config-bar {
            background-color: var(--panel-color);
            padding: 10px 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
        }

        .config-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
        }

        .config-group label {
            color: #888;
            white-space: nowrap;
        }

        .config-group input {
            background: #090a0f;
            border: 1px solid #3a3f4d;
            color: var(--accent-color);
            padding: 6px;
            font-family: inherit;
            font-size: 12px;
            width: 100%;
            outline: none;
        }

        /* Окно терминала / чата */
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 4px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 14px;
            border: 1px solid #232834;
        }

        .user {
            background-color: var(--user-msg);
            align-self: flex-end;
            border-left: 3px solid var(--accent-color);
        }

        .ai {
            background-color: var(--ai-msg);
            align-self: flex-start;
            border-left: 3px solid #ff0055; /* Розовый маркер ИИ */
        }

        /* Нижняя панель ввода */
        .input-bar {
            background-color: var(--panel-color);
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border-color);
        }

        .input-bar textarea {
            flex-grow: 1;
            background: #090a0f;
            border: 1px solid #3a3f4d;
            color: var(--text-color);
            padding: 10px;
            resize: none;
            height: 44px;
            font-family: inherit;
            outline: none;
        }

        .input-bar button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 0 25px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        .input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Настройки подключения к ИИ -->
    <div class="config-bar">
        <div class="config-group">
            <label for="api-url">HOST_URL:</label>
            <input type="text" id="api-url" value="http://localhost:11434/v1" placeholder="Эндпоинт твоего ИИ-сервера">
        </div>
        <div class="config-group" style="flex-grow: 0; width: 250px;">
            <label for="model-name">MODEL:</label>
            <input type="text" id="model-name" value="qwen2.5-coder" placeholder="Название модели">
        </div>
    </div>

    <!-- Поле вывода сообщений -->
    <div class="chat-container" id="chat">
        <div class="message ai">🛸 Монолитный терминал HELLAAC готов. Ожидаю подключение локального ИИ-ядра из репозитория...</div>
    </div>

    <!-- Ввод команд -->
    <div class="input-bar">
        <textarea id="user-input" placeholder="Напиши команду для препарирования кода..." autofocus></textarea>
        <button id="send-btn" onclick="sendMessage()">RUN</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiUrlInput = document.getElementById('api-url');
        const modelNameInput = document.getElementById('model-name');

        let history = [];

        // Перехват Ctrl+Enter для отправки
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            const host = apiUrlInput.value.trim();
            const model = modelNameInput.value.trim();

            if (!text) return;

            // Блокируем интерфейс
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Отрисовка сообщения юзера
            appendMessage(text, 'user');
            history.push({ role: 'user', content: text });

            // Заглушка ожидания ИИ
            const aiMessageDiv = appendMessage('🛸 Обработка байтов процессором...', 'ai');

            try {
                // Универсальный ванильный fetch запрос к API
                const response = await fetch(`${host}/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: model,
                        messages: history
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    aiMessageDiv.textContent = reply;
                    history.push({ role: 'assistant', content: reply });
                } else {
                    aiMessageDiv.textContent = 'Системный сбой: сервер вернул пустой буфер кадра.';
                }
            } catch (err) {
                aiMessageDiv.textContent = 'Критическая ошибка связи с локальным ИИ: ' + err.message + '\n\nУбедись, что сервер в Termux или GitHub Actions запущен и принимает входящие пакеты.';
            }

            // Разблокируем ввод
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
