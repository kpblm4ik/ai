<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude AI Chat</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --text-color: #ffffff;
            --input-bg: #3d3d3d;
            --accent-color: #007acc;
            --user-msg: #0e639c;
            --ai-msg: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--panel-bg);
            padding: 10px;
            border-bottom: 1px solid #444;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        @media (max-width: 600px) {
            .settings-grid { grid-template-columns: 1fr; }
        }
        input, select, button {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--accent-color); }
        button {
            background-color: var(--accent-color);
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .user { align-self: flex-end; background-color: var(--user-msg); }
        .ai { align-self: flex-start; background-color: var(--ai-msg); }
        .system { align-self: center; background: none; color: #aaa; font-size: 12px; }

        footer {
            background-color: var(--panel-bg);
            padding: 10px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #444;
        }
        #user-input { flex: 1; resize: none; height: 40px; }
        #send-btn { width: 80px; }
    </style>
</head>
<body>

    <header>
        <div class="settings-grid">
            <input type="password" id="api-key" placeholder="API Key (sk-...)">
            <input type="text" id="base-url" placeholder="Base URL (https://proxyapi.ru)">
        </div>
        <div class="settings-grid">
            <input type="text" id="model-name" placeholder="Модель (например, anthropic/claude-sonnet-5-5)">
            <button id="save-settings-btn" onclick="saveSettings()">💾 Сохранить настройки</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="message system">Система готова. Заполните настройки выше, чтобы начать общение.</div>
    </div>

    <footer>
        <input type="text" id="user-input" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">Отправить</button>
    </footer>

    <script>
        let history = [];

        // Загрузка настроек при открытии страницы
        window.onload = function() {
            if (localStorage.getItem('proxy_api_key')) document.getElementById('api-key').value = localStorage.getItem('proxy_api_key');
            if (localStorage.getItem('proxy_base_url')) document.getElementById('base-url').value = localStorage.getItem('proxy_base_url');
            if (localStorage.getItem('proxy_model_name')) {
                document.getElementById('model-name').value = localStorage.getItem('proxy_model_name');
            } else {
                document.getElementById('model-name').value = 'anthropic/claude-sonnet-5-5'; // Дефолтное рабочее имя
            }
        };

        function saveSettings() {
            const key = document.getElementById('api-key').value.strip ? document.getElementById('api-key').value.strip() : document.getElementById('api-key').value.trim();
            let url = document.getElementById('base-url').value.strip ? document.getElementById('base-url').value.strip() : document.getElementById('base-url').value.trim();
            const model = document.getElementById('model-name').value.strip ? document.getElementById('model-name').value.strip() : document.getElementById('model-name').value.trim();

            // Если пользователь забыл дописать эндпоинт к хосту, помогаем ему
            if (url && !url.endsWith('/chat/completions')) {
                if (!url.endsWith('/v1')) {
                    if (url.endsWith('/')) url = url.slice(0, -1);
                    url += '/v1';
                }
                url += '/chat/completions';
                document.getElementById('base-url').value = url;
            }

            localStorage.setItem('proxy_api_key', key);
            localStorage.setItem('proxy_base_url', url);
            localStorage.setItem('proxy_model_name', model);

            appendMessage('system', '✅ Настройки успешно сохранены в браузере!');
        }

        function appendMessage(role, text) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const inputEl = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const text = inputEl.value.trim();
            
            if (!text) return;

            const apiKey = localStorage.getItem('proxy_api_key');
            const baseUrl = localStorage.getItem('proxy_base_url');
            const modelName = localStorage.getItem('proxy_model_name');

            if (!apiKey || !baseUrl || !modelName) {
                alert('Сначала заполните настройки и нажмите кнопку "Сохранить настройки"!');
                return;
            }

            // Отображаем сообщение пользователя
            appendMessage('user', text);
            inputEl.value = '';
            
            // Блокируем интерфейс на время запроса
            inputEl.disabled = true;
            sendBtn.disabled = true;

            // Добавляем реплику в контекст
            history.push({"role": "user", "content": text});

            try {
                const response = await fetch(baseUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        'model': modelName,
                        'messages': history
                    })
                });

                if (!response.ok) {
                    const errData = await response.text();
                    throw new Error(`Код ${response.status}: ${errData}`);
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                // Отображаем ответ ИИ и сохраняем в историю
                appendMessage('ai', aiText);
                history.push({"role": "assistant", "content": aiText});

            } catch (error) {
                appendMessage('system', `❌ Ошибка запроса: ${error.message}`);
                history.pop(); // Удаляем последний запрос из памяти, раз он упал
            } finally {
                inputEl.disabled = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }
    </script>
</body>
</html>
