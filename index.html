<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude AI Chat & History</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --sidebar-bg: #202020;
            --text-color: #ffffff;
            --input-bg: #3d3d3d;
            --accent-color: #007acc;
            --user-msg: #0e639c;
            --ai-msg: #333333;
            --active-chat: #3a3a3a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Боковая панель чатов */
        #sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            flex-shrink: 0;
        }
        #chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .chat-item {
            padding: 10px;
            background-color: var(--panel-bg);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            overflow: hidden;
        }
        .chat-item span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            margin-right: 5px;
        }
        .chat-item.active { background-color: var(--active-chat); border-left: 4px solid var(--accent-color); }
        .delete-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            padding: 0 5px;
        }

        /* Главная область */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        header {
            background-color: var(--panel-bg);
            padding: 10px;
            border-bottom: 1px solid #444;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        input, button {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            outline: none;
        }
        button { background-color: var(--accent-color); cursor: pointer; font-weight: bold; border: none; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .new-chat-btn { background-color: #28a745; margin-bottom: 5px; }
        
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .user { align-self: flex-end; background-color: var(--user-msg); }
        .ai { align-self: flex-start; background-color: var(--ai-msg); }
        .system { align-self: center; background: none; color: #aaa; font-size: 12px; text-align: center; }
        
        code {
            background-color: #111;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #ff79c6;
        }
        pre {
            background-color: #111;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }
        pre code {
            padding: 0;
            display: block;
            color: #f8f8f2;
        }

        footer {
            background-color: var(--panel-bg);
            padding: 10px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #444;
        }
        #user-input { flex: 1; }
        #send-btn { width: 100px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 160px; border-right: none; border-bottom: 1px solid #444; }
            .settings-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">➕ Новый чат</button>
        <div id="chat-list"></div>
    </div>

    <div id="main-content">
        <header>
            <div class="settings-grid">
                <input type="password" id="api-key" placeholder="API Key (sk-...)">
                <input type="text" id="base-url" placeholder="Base URL (https://proxyapi.ru)">
            </div>
            <div class="settings-grid">
                <input type="text" id="model-name" placeholder="Модель (anthropic/claude-sonnet-5-5)">
                <button onclick="saveSettings()">💾 Сохранить настройки</button>
            </div>
        </header>

        <div id="chat-container"></div>

        <footer>
            <input type="text" id="user-input" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="send-btn" onclick="sendMessage()">Отправить</button>
        </footer>
    </div>

    <script>
        let chats = {};
        let currentChatId = null;

        window.onload = function() {
            if (localStorage.getItem('proxy_api_key')) document.getElementById('api-key').value = localStorage.getItem('proxy_api_key');
            if (localStorage.getItem('proxy_base_url')) document.getElementById('base-url').value = localStorage.getItem('proxy_base_url');
            document.getElementById('model-name').value = localStorage.getItem('proxy_model_name') || 'anthropic/claude-sonnet-5-5';

            const savedChats = localStorage.getItem('proxy_chats');
            if (savedChats) {
                chats = JSON.parse(savedChats);
                const chatIds = Object.keys(chats);
                if (chatIds.length > 0) {
                    currentChatId = chatIds[chatIds.length - 1];
                }
            }

            if (!currentChatId) {
                createNewChat();
            } else {
                renderChatList();
                renderMessages();
            }
        };

        function saveSettings() {
            const key = document.getElementById('api-key').value.trim();
            let url = document.getElementById('base-url').value.trim();
            const model = document.getElementById('model-name').value.trim();

            if (url && !url.endsWith('/chat/completions')) {
                if (!url.endsWith('/v1')) {
                    if (url.endsWith('/')) url = url.slice(0, -1);
                    url += '/v1';
                }
                url += '/chat/completions';
                document.getElementById('base-url').value = url;
            }

            localStorage.setItem('proxy_api_key', key);
            localStorage.setItem('proxy_base_url', url);
            localStorage.setItem('proxy_model_name', model);
            alert('Настройки сохранены успешно!');
        }

        function createNewChat() {
            const id = 'chat_' + Date.now();
            chats[id] = {
                title: 'Новый диалог',
                messages: []
            };
            currentChatId = id;
            saveChatsToStorage();
            renderChatList();
            renderMessages();
        }

        function switchChat(id) {
            currentChatId = id;
            renderChatList();
            renderMessages();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            delete chats[id];
            const chatIds = Object.keys(chats);
            if (currentChatId === id) {
                currentChatId = chatIds.length > 0 ? chatIds[chatIds.length - 1] : null;
            }
            if (!currentChatId) {
                createNewChat();
            } else {
                saveChatsToStorage();
                renderChatList();
                renderMessages();
            }
        }

        function saveChatsToStorage() {
            localStorage.setItem('proxy_chats', JSON.stringify(chats));
        }

        function renderChatList() {
            const listContainer = document.getElementById('chat-list');
            listContainer.innerHTML = '';
            Object.keys(chats).forEach(id => {
                const item = document.createElement('div');
                item.classList.add('chat-item');
                if (id === currentChatId) item.classList.add('active');
                item.onclick = () => switchChat(id);

                const titleSpan = document.createElement('span');
                titleSpan.textContent = chats[id].title;
                item.appendChild(titleSpan);

                const delBtn = document.createElement('button');
                delBtn.classList.add('delete-btn');
                delBtn.innerHTML = '🗑️';
                delBtn.onclick = (e) => deleteChat(id, e);
                item.appendChild(delBtn);

                listContainer.appendChild(item);
            });
        }
